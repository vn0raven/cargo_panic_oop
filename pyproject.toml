[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cargo-panic-ui"
version = "1.0.0"
description = "UI-enhanced warehouse sorting game built with Pygame"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pygame>=2.5,<3",
]

[project.optional-dependencies]
webcam = [
  "opencv-python>=4.9,<5",
  "mediapipe>=0.10,<1",
]

[project.scripts]
cargo-panic = "main:main"

[tool.setuptools]
packages = ["cargo_panic"]
py-modules = ["main"]
