name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run domain tests
        run: python -m unittest discover -s tests -v

      - name: Build one-file executable
        run: python -m PyInstaller --clean --noconfirm CargoPanic.spec

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          & .\dist\CargoPanic.exe --headless
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare artifact and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item .\dist\CargoPanic.exe .\release\CargoPanic.exe
          $hash = (Get-FileHash .\release\CargoPanic.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CargoPanic.exe" | Set-Content .\release\CargoPanic.exe.sha256 -Encoding ascii
          Compress-Archive -Path .\release\CargoPanic.exe, .\release\CargoPanic.exe.sha256 -DestinationPath .\release\CargoPanic-Windows-x64.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: CargoPanic-Windows-x64
          path: |
            release/CargoPanic.exe
            release/CargoPanic.exe.sha256
            release/CargoPanic-Windows-x64.zip
          if-no-files-found: error
